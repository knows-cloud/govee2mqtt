labels:
  org.opencontainers.image.title: "Home Assistant Add-on: Govee to MQTT Bridge (Fork)"
  org.opencontainers.image.description: "Acts as a bridge between Govee devices and Home Assistant, via the Home Assistant MQTT Integration."
  org.opencontainers.image.source: "https://github.com/knows-cloud/govee2mqtt"
  org.opencontainers.image.licenses: "MIT"

# Pin the base images explicitly rather than letting the builder pick :latest.
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base-debian:bookworm"
  amd64: "ghcr.io/home-assistant/amd64-base-debian:bookworm"
